[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "douse"
version = "0.5.0"
description = "Domains of Unknown Shape, from Eigenvalues: shape optimization and inverse spectral problems on top of chladni"
authors = [{name = "Hayden Ringer", email = "hringer@vt.edu"}]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy >= 2.0",
    "scipy >= 1.14",
    "matplotlib >= 3.9",
    "joblib >= 1.4",
    "chladni",
    # The SDP branch of the cluster subproblem (`cluster_opt`); imported lazily there.
    "cvxpy>=1.9.2",
]

[project.optional-dependencies]
test = ["pytest >= 8.4"]
# Notebooks under jupyter_notebooks/ and the animation benchmarks; not needed by the package.
dev = ["douse[test]", "jupyter >= 1.1.1", "ipython >= 8.22"]
# lappy is no longer a dependency, not even an optional one (2026-11-13). The deprecated lappy
# backend (`LappySpectrumEvaluator`, `lappy_domain`, a few old benchmarks) imports it lazily and
# says so if it is missing; to reproduce pre-chladni results, install lappy into its own
# environment by hand (it cannot run beside chladni's gsvd4py >= 0.4, which removed `tola`/`tolb`).

[tool.uv.sources]
chladni = { path = "../chladni", editable = true }
