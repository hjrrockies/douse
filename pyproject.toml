[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "douse"
version = "0.0.1"
description = "Domains of Unknown Shape, from Eigenvalues: shape optimization and inverse spectral problems on top of lappy"
authors = [{name = "Hayden Ringer", email = "hringer@vt.edu"}]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy >= 2.0",
    "scipy >= 1.14",
    "matplotlib >= 3.9",
    "joblib >= 1.4",
    "jupyter>=1.1.1",
    "lappy>=0.9",
    "ipython==8.22.0",
    "cvxpy>=1.9.2",
]

[tool.uv.sources]
lappy = { path = "../lappy", editable = true }
