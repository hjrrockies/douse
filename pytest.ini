[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# The slow tier -- full optimization runs, minutes each -- is DESELECTED by default, as in
# chladni. `uv run pytest -m slow` runs it; `-m ""` runs everything. The fast tier keeps one
# real end-to-end run (tests/test_pipeline_fast.py).
addopts = -v --tb=short -m "not slow"
markers =
    slow: a full optimization run or several eigensolves; minutes. Deselected by default.
    lappy: tests the deprecated lappy backend (douse[lappy]); skipped without a working lappy.
