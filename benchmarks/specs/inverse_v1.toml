# The inverse-problem results (2026-11-02): recovery from K eigenvalues under relative noise
# sigma, from inverse_pilot_v1's findings:
#  - prec 1e-9: at 1e-10 the obtuse triangle's fits stalled on refused trial shapes near the
#    answer; at 1e-9 the same start recovered it to 6e-12 with no refusals;
#  - grid_starts: start 0 of a triangle case is the nearest triangle_grid_v1 triangle by its
#    ratios (a data-only lookup); from random starts alone the obtuse triangle at K = 10 fell
#    into a wrong isosceles minimum on all three;
#  - each row records the singular values of the ratio Jacobian at the true shape (`true_sv`),
#    the predicted noise amplification.
# Five triangles (an isosceles one sits on the mirror fold), each placed OFF the grid's 0.01
# lattice so the lookup returns a neighbour rather than the answer, the rectangle, a quadrilateral and
# a pentagon; K from the minimum 2N - 3 up to 10.
name = "inverse_v1"
notes = "Noise sweep: 6 sigmas, 3 draws, 3 starts per (case, K). Triangle start 0 is a grid lookup."
cases = [
  {name = "rect_1.2x0.8",  kind = "rectangle", L = 1.2, H = 0.8, K = [5, 6, 10]},
  {name = "tri_acute",     kind = "polygon", vertices = [[0, 0], [1, 0], [0.303, 0.497]],   K = [3, 4, 6, 10]},
  {name = "tri_obtuse",    kind = "polygon", vertices = [[0, 0], [1, 0], [0.203, 0.254]],  K = [3, 4, 6, 10]},
  {name = "tri_near_eq",   kind = "polygon", vertices = [[0, 0], [1, 0], [0.452, 0.747]], K = [3, 4, 6, 10]},
  {name = "tri_wide",      kind = "polygon", vertices = [[0, 0], [1, 0], [0.404, 0.297]],   K = [3, 4, 6, 10]},
  {name = "tri_isosceles", kind = "polygon", vertices = [[0, 0], [1, 0], [0.5, 0.404]],   K = [3, 4, 6, 10]},
  {name = "quad",          kind = "polygon", vertices = [[0, 0], [1, 0], [1.2, 0.7], [0.3, 0.9]], K = [5, 6, 10]},
  {name = "pent",          kind = "polygon", vertices = [[0, 0], [1, 0], [1.3, 0.6], [0.6, 1.1], [-0.2, 0.6]], K = [7, 10]},
]
sigmas = [0.0, 1e-8, 1e-6, 1e-4, 1e-3, 1e-2]
noise_draws = 3
starts = 3
seed0 = 0
max_iter = 40
max_step = 0.1
rtol = 1e-19
prec = 1e-9
target_prec = 1e-11
perim = 4.0
grid_starts = "benchmarks/run/family_grid/triangle_grid_v1"
tasks = 448
slurm_mem = "2G"
slurm_time = "24:00:00"
slurm_account = "siallocation"
slurm_partition = "normal_q"
