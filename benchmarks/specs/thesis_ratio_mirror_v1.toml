# Symmetric reruns (2026-11-03). Six cells whose best shapes are mirror-symmetric to 2e-3..6e-3
# of the perimeter -- more than the 1e-4..6e-4 that agreeing starts differ by, less than the
# clearly asymmetric cells -- rerun in `MirrorPolygon` (n - 2 parameters) from their two best
# certified rows, symmetrized (benchmarks/seeds/mirror_v1.json, `make_seeds mirror`). Each row
# also carries `antisym`: the curvature of F along every symmetry-breaking direction at the
# symmetric optimum, so it says whether that optimum is a maximum among ALL N-gons.
# N3_k4 (lam_5/lam_1, an isosceles triangle at 4.3618804575) is the control: the symmetric run
# must reproduce it and the probe must find it a maximum.
name = "thesis_ratio_mirror_v1"
notes = "7 cells x 2 seeded starts. k is 0-based (k = 1 is lam_2/lam_1)."
cells = [[3, 4], [5, 3], [5, 5], [6, 5], [7, 5], [8, 2], [8, 5]]
starts = 2
seed0 = 0
max_iter = 1200
delta0 = 0.05
prec = 1e-9
prec_final = [1e-12, 1e-11, 1e-10]
backend = "chladni"
# thesis-lock-2 (2026-11-13): the Fourier chart with Sobolev exponent s = 1, chosen by the
# go/no-go (douse docs/todo.md); a mirror spec runs it restricted to the symmetric polygons
# (`FourierMirrorPolygon`). No angle bounds: off for the Fourier runs (decided 2026-11-13).
chart = "fourier"
s = 1.0
family = "mirror"
seeds = "benchmarks/seeds/mirror_v1.json"
sigma_max = 1e-6
perim = 4.0
slurm_mem = "8G"
slurm_time = "72:00:00"
slurm_account = "siallocation"
slurm_partition = "normal_q"
