# THE FINAL MIRROR RATIO TABLE (2026-11-14, FINISHLINE_PLAN "Final runs", F2): max lam_{k+1}/lam_1
# over mirror-symmetric N-gons, in thesis-lock-2's symmetric Fourier chart
# (`FourierMirrorPolygon`, s = 1; n - 2 parameters). Cells approved by the user 2026-11-14:
# N = 5..16, k = 1..12 (0-based: lam_2/lam_1 up to lam_13/lam_1), 6 seeded starts each -- 144
# cells, 864 tasks. Each row carries `antisym`, the curvature along every symmetry-breaking
# direction, which says whether the symmetric optimum is also a maximum among ALL N-gons.
#
# - SEEDS: random symmetric star-shaped polygons (benchmarks/seeds/random_mirror_v1.json,
#   `make_seeds random_mirror`): `start_shape`'s recipe drawn for half the polygon and reflected.
#   Even N alternates the two kinds of axis (vertex, edge), 3 starts each; the first start of
#   each kind is the jittered regular N-gon. The same seeds for every k of an N.
# - 7 DAYS, RESUBMITTED ONCE: final_ratio_v1 holds 5184G of tc_normal_long's 5712G per-user
#   memory cap, so this runs on normal_q's default QOS (7 days). A start still running 2 h before
#   the limit checkpoints and exits; resubmitting the same scripts after the first week resumes it
#   (finished starts are skipped). Two weeks in all, like final_ratio_v1.
# - The seed file must sit in the release at benchmarks/seeds/ (copied in untracked, so the
#   release's douse SHA is not marked dirty); the spec can run from anywhere.
# - prec, prec_final, max_iter as final_ratio_v1; no angle bounds (decided 2026-11-13).
# - THE PROBE IS NOT DEADLINE-AWARE: `antisym` runs after the optimizer and takes r(r+1) full solves
#   (N = 16, k = 12: 210 at ~260 s each locally, ~15 h). A start killed mid-probe has no row yet, so
#   a resubmit resumes it from its checkpoint and probes again; after week 2 that may need a third
#   submit (accepted by the user 2026-11-14 rather than a lock-3 code change).
