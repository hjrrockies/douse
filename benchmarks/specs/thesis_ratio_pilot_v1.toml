# Pilot (2026-10-30) for the thesis ratio table (N = 3..8, k = 2..6): max lam_k/lam_1 over
# N-gons of perimeter 4, Dirichlet, same recipe as thesis_ratio_v0. Not a result: it measures
# wall time and peak memory per start on ARC, at the corners of the table (N = 6 and 8, k = 2
# and 6) and one cell past it (N = 10, k = 2), to size thesis_ratio_v1's slurm_time/slurm_mem
# and say whether all of N <= 8 fits before Nov 23. Laptop, 2026-10: an N = 6 start took
# 20-70 min; ARC ran the quadrilateral grid ~4.5x slower than the laptop per solve.
# Run with `python -m benchmarks.slurm <this file>`: one array job per cell, one start per task.
name = "thesis_ratio_pilot_v1"
notes = "Timing pilot: 2 starts at the table's corners plus N = 10. k is 0-based (k = 1 is lam_2/lam_1)."
cells = [[6, 1], [6, 5], [8, 1], [8, 5], [10, 1]]
starts = 2
seed0 = 0
max_iter = 400
delta0 = 0.05
prec = 1e-10
backend = "chladni"
family = "all"
sigma_max = 1e-6
perim = 4.0
slurm_mem = "4G"
slurm_time = "72:00:00"   # unknown cost past N = 6; a timed-out start writes no row
slurm_account = "siallocation"
slurm_partition = "normal_q"
