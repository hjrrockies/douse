# Triangles from every local maximum of the triangle grid (2026-11-03). The grid
# (triangle_grid_v1, h = 0.01) puts every N = 3 optimum within one spacing of its best triangle,
# but a neighbour-slope bound could not rule out other regions for lam_5/lam_1 and lam_6/lam_1.
# One local run from each grid local maximum (benchmarks/seeds/grid_v1.json, `make_seeds grid`).
name = "thesis_ratio_gridseed_v1"
notes = "N3_k4: 3 seeds, N3_k5: 9 seeds. k is 0-based (k = 1 is lam_2/lam_1)."
cells = [[3, 4], [3, 5]]
starts = 9
seed0 = 0
max_iter = 1200
delta0 = 0.05
prec = 1e-9
prec_final = [1e-12, 1e-11, 1e-10]
backend = "chladni"
family = "all"
seeds = "benchmarks/seeds/grid_v1.json"
sigma_max = 1e-6
perim = 4.0
slurm_mem = "8G"
slurm_time = "24:00:00"
slurm_account = "siallocation"
slurm_partition = "normal_q"
