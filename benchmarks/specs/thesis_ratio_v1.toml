# The thesis ratio table (2026-10-31): max lam_k/lam_1 over N-gons of perimeter 4, Dirichlet,
# N = 3..8 and k = 2..6 (0-based k = 1..5; decision D2), 8 starts per cell. The recipe is
# thesis_ratio_v0's; only the cells and the scheduling changed.
# Sized from thesis_ratio_pilot_v1 on ARC: a start took 0.5-6 h at N = 6, 5-13 h at N = 8
# (N = 10: 9-10 h), peak memory 2.3 GB at N = 8; one N = 6, k = 5 start was still running at 20 h.
# Run with `python -m benchmarks.slurm <this file>`: one array job per cell, one start per task.
name = "thesis_ratio_v1"
notes = "30 cells x 8 starts = 240 tasks, ~1000-1500 CPU-h. k is 0-based (k = 1 is lam_2/lam_1)."
cells = [[3, 1], [3, 2], [3, 3], [3, 4], [3, 5],
         [4, 1], [4, 2], [4, 3], [4, 4], [4, 5],
         [5, 1], [5, 2], [5, 3], [5, 4], [5, 5],
         [6, 1], [6, 2], [6, 3], [6, 4], [6, 5],
         [7, 1], [7, 2], [7, 3], [7, 4], [7, 5],
         [8, 1], [8, 2], [8, 3], [8, 4], [8, 5]]
starts = 8
seed0 = 0
max_iter = 400
delta0 = 0.05
prec = 1e-10
backend = "chladni"
family = "all"
sigma_max = 1e-6
perim = 4.0
slurm_mem = "4G"
slurm_time = "72:00:00"
slurm_account = "siallocation"
slurm_partition = "normal_q"
