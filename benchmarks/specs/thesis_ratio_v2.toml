# The thesis ratio table, N = 6..8 (2026-11-02): thesis_ratio_v1's cells for N >= 6 again, with
# three times the iteration budget and prec 1e-9. In v1 (400 iterations, 1e-10) most N >= 6
# starts stopped before a first-order certificate: N = 6/7/8 certified 13/6/5 of 40 starts, with
# 18/20/25 hitting max_iter and 8/6/7 ending on refused trials; three cells certified none.
# 1e-9 because 1e-10 refusals stalled shape fits elsewhere (inverse_pilot_v1's obtuse triangle:
# stuck at 1e-10, recovered to 6e-12 at 1e-9 from the same start) and the quadrilateral grids
# were as accurate at 1e-9. Same starts as v1 (same seed0), so a cell's rows can be compared.
name = "thesis_ratio_v2"
notes = "15 cells x 8 starts = 120 tasks. k is 0-based (k = 1 is lam_2/lam_1)."
cells = [[6, 1], [6, 2], [6, 3], [6, 4], [6, 5],
         [7, 1], [7, 2], [7, 3], [7, 4], [7, 5],
         [8, 1], [8, 2], [8, 3], [8, 4], [8, 5]]
starts = 8
seed0 = 0
max_iter = 1200
delta0 = 0.05
prec = 1e-9
backend = "chladni"
family = "all"
sigma_max = 1e-6
perim = 4.0
slurm_mem = "4G"
slurm_time = "72:00:00"   # v1's slowest N = 8 start: 13 h for 304 iterations
slurm_account = "siallocation"
slurm_partition = "normal_q"
